
name: Scrape Integration Course Finder

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Installiere R
        uses: r-lib/actions/setup-r@v2

      - name: Installiere R-Pakete stabil
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: httr, tidyr, sf, dplyr, tidyverse

      - name: Starte Scraper
        run: Rscript 02_scrape_courses.R

      - name: Bereite neue RDS-Dateien vor
        shell: bash
        run: |
          mkdir -p artifact-output

          shopt -s nullglob
          found=0

          for f in *.rds; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              mv -- "$f" artifact-output/
              found=1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "Keine neue RDS-Datei gefunden."
            exit 1
          fi

          ls -lh artifact-output/

      - name: Speichere neue RDS-Dateien als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamf-${{ github.run_id }}
          path: artifact-output/*.rds
          if-no-files-found: error
          retention-days: 30
